name: Build Mod

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64
            configure-args: "-DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl"
          - name: Android64
            os: ubuntu-latest
            target: Android64
            configure-args: ""

    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Build Mod
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: v5.9.0
          combine: true
          target: ${{ matrix.config.target }}
          configure-args: "-DCMAKE_POLICY_VERSION_MINIMUM=3.5 ${{ matrix.config.configure-args }}"

  package:
    name: Package Mod
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Upload Artifact
        uses: actions/upload-artifact@v5
        with:
          name: MPEdit
          path: ${{ steps.build.outputs.build-output }}
